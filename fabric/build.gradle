plugins { id 'fabric-loom' }

repositories { maven { url = 'https://maven.fabricmc.net/' } }
dependencies {
    minecraft libs.minecraft
    mappings "net.fabricmc:yarn:${libs.versions.yarn.get()}:v2"
    modImplementation libs.fabric.loader
    modImplementation libs.fabric.api
    // 组合进来的 Loom 工程编译取 named 开发 JAR（上游随本仓先行构建）；Items 没有 Fabric 模组描述，同样直接用 named 库。
    // 开发运行时这些模块由完整装配按替换坐标装入，这里不再声明第二份。
    compileOnly('dev.kizuna.backpack3d:server') { targetConfiguration = 'namedElements' }
    compileOnly('dev.kizuna.inventoryui:server') { targetConfiguration = 'namedElements' }
    compileOnly('dev.kizuna.meridian.items:kizuna-meridian-items-addon') { targetConfiguration = 'namedElements' }
    compileOnly 'local.meridian:server'
    // Items 是必需宿主库，没有独立模组 ID；安装产物内嵌一次。
    include 'dev.kizuna.meridian.items:kizuna-meridian-items-addon'
    implementation project(':server')
    include project(':server')
    implementation project(':shared')
    include project(':shared')
    // 版本目录条目是 Provider，implementation 不返回依赖对象，嵌套声明单独写。
    implementation libs.protobuf.java
    include libs.protobuf.java
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}

// Loom 只按坐标复用 modprocessing 里的嵌套 JAR，SNAPSHOT 坐标不变时会把旧 server/shared JAR 打进发布 JAR；
// 每次打发布 JAR 前清掉该缓存，让 include 的 JAR 按当前产物重新生成。
def clearNestedJarCache = tasks.register('clearNestedJarCache', Delete) {
    delete layout.buildDirectory.dir('loom-cache/temp/modprocessing')
}
tasks.named('remapJar') {
    dependsOn clearNestedJarCache
}
loom { mods { meridian_progression { sourceSet sourceSets.main } } }

apply from: new File(kizunaWorkspace.directory('framework'), 'scripts/full-assembly.gradle')
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}
loom {
    mods { meridian_progression_test { sourceSet sourceSets.gametest } }
    runs {
        gametest {
            server()
            source sourceSets.gametest
            runDir 'build/gametest'
            vmArg '-Dfabric-api.gametest'
            vmArg '-Dfabric-api.gametest.report-file=build/gametest-results.xml'
        }
    }
}
