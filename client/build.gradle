plugins { id 'fabric-loom' }

def inventoryJar = rootProject.file('../Kizuna-Inventory-UI-Framework/build/libs/kizuna-inventory-ui-framework-0.1.0-SNAPSHOT.jar')
if (!inventoryJar.isFile()) {
    throw new GradleException("需要已构建的 Inventory UI 客户端产物：${inventoryJar}")
}
repositories { maven { url = 'https://maven.fabricmc.net/' } }
dependencies {
    minecraft 'com.mojang:minecraft:1.20.1'
    mappings 'net.fabricmc:yarn:1.20.1+build.10:v2'
    modImplementation 'net.fabricmc:fabric-loader:0.16.10'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.92.3+1.20.1'
    modImplementation files(inventoryJar)
    implementation project(':shared')
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
loom { mods { meridian_progression_client { sourceSet sourceSets.main } } }
apply from: '../../Kizuna-Meridian-Mod-Framework/scripts/full-assembly.gradle'
