plugins { id 'fabric-loom' }

repositories { maven { url = 'https://maven.fabricmc.net/' } }
dependencies {
    minecraft libs.minecraft
    mappings loom.officialMojangMappings()
    modImplementation libs.fabric.loader
    modImplementation libs.fabric.api
    // Inventory UI 客户端以源码组合，编译取 named 开发 JAR；开发运行由完整装配按替换坐标装入。
    compileOnly('dev.kizuna.inventoryui:kizuna-inventory-ui-framework') { targetConfiguration = 'namedElements' }
    implementation project(':shared')
    testImplementation libs.junit4
}
test { useJUnit() }
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
loom { mods { meridian_progression_client { sourceSet sourceSets.main } } }
apply from: new File(kizunaWorkspace.directory('framework'), 'scripts/full-assembly.gradle')
