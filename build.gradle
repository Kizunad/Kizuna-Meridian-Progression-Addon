plugins {
    id 'base'
    alias(libs.plugins.fabric.loom) apply false
    alias(libs.plugins.protobuf) apply false
}

allprojects {
    group = 'dev.kizuna.meridian.progression'
    version = '0.1.0-SNAPSHOT'
}

subprojects {
    apply plugin: 'java-library'
    repositories { mavenCentral() }
    java {
        toolchain { languageVersion = JavaLanguageVersion.of(libs.versions.java.get()) }
        withSourcesJar()
    }
    base.archivesName = "${rootProject.name}-${project.name}"
    tasks.withType(JavaCompile).configureEach {
        options.release = libs.versions.java.get().toInteger()
        options.encoding = 'UTF-8'
    }
    tasks.withType(JavaExec).configureEach {
        javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(libs.versions.java.get()) }
    }
    tasks.withType(Jar).configureEach {
        from(rootProject.files('LICENSE', 'NOTICE', 'LICENSE-PROTOBUF',
                'LICENSE-BS3D', 'LICENSE-INVENTORY-UI', 'THIRD_PARTY_NOTICES.md'))
    }
}

tasks.named('assemble') { dependsOn subprojects.collect { "${it.path}:assemble" } }
tasks.named('check') { dependsOn subprojects.collect { "${it.path}:check" }, 'checkDocs' }
tasks.register('test') { dependsOn ':server:test', ':client:test' }
tasks.register('checkDocs', Exec) { commandLine 'python3', 'scripts/check_docs.py' }
